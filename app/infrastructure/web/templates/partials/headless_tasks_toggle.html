<div id="headless-tasks-toggles" class="flex items-center justify-between gap-4">
    <span class="text-sm text-slate-700">Nas tarefas</span>
    <button hx-post="/api/settings/toggle-headless" hx-vals='{"target": "tasks"}' hx-target="#headless-tasks-toggles"
        hx-swap="outerHTML" role="switch" aria-checked="{{ 'true' if headless_mode_tasks else 'false' }}" aria-label="Navegador oculto nas tarefas"
        {% if is_docker %}disabled title="No servidor o navegador é sempre oculto" {% endif %}
        class="relative inline-flex h-6 w-11 flex-shrink-0 items-center rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2 {% if is_docker %}cursor-not-allowed opacity-50{% else %}cursor-pointer{% endif %} {% if headless_mode_tasks %}bg-indigo-600{% else %}bg-slate-200{% endif %}">
        <span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out {% if headless_mode_tasks %}translate-x-5{% else %}translate-x-0{% endif %}"></span>
    </button>
</div>
